name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama aplikasi'
        required: true
        default: 'Aplikasi Saya'
      package_name:
        description: 'Nama package, contoh com.riki.aplikasi'
        required: true
        default: 'com.riki.aplikasi'
      version_name:
        description: 'Versi aplikasi'
        required: true
        default: '1.0'
      version_code:
        description: 'Kode versi, angka positif'
        required: true
        default: '1'
      source_type:
        description: 'Sumber aplikasi'
        required: true
        type: choice
        options: [zip, html, url]
        default: zip
      source_path:
        description: 'Path file di repo, contoh input/source.zip atau input/index.html'
        required: false
        default: 'input/source.zip'
      source_url:
        description: 'URL website jika source_type=url'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Prepare Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          SOURCE_TYPE: ${{ inputs.source_type }}
          SOURCE_PATH: ${{ inputs.source_path }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: python3 scripts/prepare_cloud.py
      - name: Build signed debug APK
        working-directory: build-project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          mkdir -p output
          SAFE_NAME=$(printf '%s' "$APP_NAME" | sed 's/[^A-Za-z0-9_-]/_/g')
          cp build-project/app/build/outputs/apk/debug/app-debug.apk "output/${SAFE_NAME}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
